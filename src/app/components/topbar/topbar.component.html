<header
  class="relative sticky top-0 z-30 flex h-14 items-center justify-between border-b border-slate-100 bg-white/95 px-4 backdrop-blur-md sm:px-6">
  <!-- LEFT: SEARCH BAR & MOBILE TOGGLE -->
  <div class="flex flex-1 items-center gap-3 max-w-sm sm:max-w-md">
    <!-- Mobile Menu -->
    <button type="button" (click)="toggleMobileSidebar()" aria-label="Toggle Navigation Menu"
      class="flex h-8.5 w-8.5 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-slate-500 transition hover:bg-slate-50 lg:hidden">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- SEARCH BAR (ON LEFT) -->
    <div
      class="flex h-9 w-full items-center rounded-lg border border-slate-200 bg-slate-50/80 px-3 transition focus-within:border-[#8c7ae6] focus-within:bg-white focus-within:ring-2 focus-within:ring-[#8c7ae6]/20">
      <svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4" stroke-linecap="round"></path>
      </svg>

      <input type="text" placeholder="Quick search..."
        class="h-full w-full bg-transparent px-2.5 text-xs font-semibold text-slate-800 outline-none placeholder:text-slate-400" />

      <span
        class="hidden shrink-0 rounded border border-slate-200 bg-white px-1.5 py-0.5 text-[10px] font-bold text-slate-400 sm:block">
        ⌘K
      </span>
    </div>
  </div>

  <!-- RIGHT: NOTIFICATIONS & PROFILE -->
  <div class="flex items-center gap-2.5">

    <!-- NOTIFICATION -->
    <button type="button" data-tooltip="Notifications"
      class="relative flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 transition hover:border-[#8c7ae6] hover:text-[#8c7ae6]">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 21h4" />
      </svg>
      <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-1 ring-white"></span>
    </button>

    <!-- DIVIDER -->
    <div class="hidden h-6 w-px bg-slate-200 sm:block"></div>

    <!-- PROFILE WRAPPER -->
    <div class="relative">
      <!-- PROFILE BUTTON -->
      <button type="button" (click)="toggleProfileMenu()"
        class="flex items-center gap-2 rounded-lg p-1 transition hover:bg-slate-50">
        <!-- AVATAR -->
        <div
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-[#8c7ae6] to-[#7158e2] text-xs font-bold text-white shadow-2xs">
          {{ userInitial }}
        </div>

        <!-- USER INFO -->
        <div class="hidden text-left sm:block">
          <p class="text-xs font-bold leading-none text-slate-900">
            {{ userName }}
          </p>
          <p class="mt-1 text-xs leading-none text-slate-500 capitalize font-medium">
            {{ userRole }}
          </p>
        </div>

        <!-- CHEVRON -->
        <svg class="hidden h-3 w-3 text-slate-400 transition-transform duration-200 sm:block"
          [class.rotate-180]="isProfileMenuOpen" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
        </svg>
      </button>

      <!-- PROFILE DROPDOWN -->
      @if (isProfileMenuOpen) {
      <div
        class="absolute right-0 top-[42px] z-50 w-48 overflow-hidden rounded-lg border border-slate-200 bg-white p-1 shadow-lg">
        <!-- User header in dropdown -->
        <div class="px-2.5 py-1.5 border-b border-slate-100 mb-1">
          <p class="text-xs font-bold text-slate-900 truncate">{{ userName }}</p>
          <p class="text-xs text-slate-500 truncate font-medium">{{ userEmail }}</p>
        </div>

        <!-- LOGOUT -->
        <button type="button" (click)="logout()" [disabled]="isLoggingOut"
          class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm font-semibold text-slate-700 transition hover:bg-rose-50 hover:text-rose-600 disabled:cursor-not-allowed disabled:opacity-50">
          @if (isLoggingOut) {
          <svg class="h-4 w-4 animate-spin text-rose-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4z"></path>
          </svg>
          } @else {
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m10 17 5-5-5-5M15 12H3" />
          </svg>
          }
          {{ isLoggingOut ? 'Logging out...' : 'Sign out' }}
        </button>
      </div>
      }
    </div>
  </div>
</header>
