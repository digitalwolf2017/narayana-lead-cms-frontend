@if (true) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">

    <div class="flex items-center gap-3 border-b border-slate-100 p-4 bg-rose-50/50">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-rose-100 text-rose-600">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </div>
      <div>
        <h3 class="text-sm font-bold text-slate-900">{{ title }}</h3>
        @if (apiEndpoint) {
        <p class="text-[11px] text-slate-500">{{ apiEndpoint }}</p>
        }
      </div>
    </div>

    <div class="p-5 space-y-3">
      @if (deleteError) {
      <div class="rounded-xl border border-rose-200 bg-rose-50 p-3 text-xs text-rose-700">
        {{ deleteError }}
      </div>
      }
      <p class="text-xs text-slate-600" [innerHTML]="message"></p>
      @if (noticeText) {
      <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-[11px] text-slate-500">
        <p class="font-semibold text-slate-700">Notice:</p>
        <p class="mt-0.5">{{ noticeText }}</p>
      </div>
      }
    </div>

    <div class="flex items-center justify-end gap-2 border-t border-slate-100 p-4 bg-slate-50/50">
      <button type="button" (click)="cancelled.emit()" [disabled]="isDeleting"
        class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">
        Cancel
      </button>
      <button type="button" (click)="confirmed.emit()" [disabled]="isDeleting"
        class="inline-flex items-center gap-1.5 rounded-lg bg-rose-600 px-4 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-rose-700 disabled:opacity-50">
        @if (isDeleting) {
        <svg class="h-3.5 w-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        Deleting...
        } @else {
        Confirm Delete
        }
      </button>
    </div>

  </div>
</div>
}
