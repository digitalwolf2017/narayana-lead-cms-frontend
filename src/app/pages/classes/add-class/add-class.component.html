<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-sidebar></app-sidebar>

  <div class="lg:ml-[230px]">
    <app-topbar title="Add Class" subtitle="Class Master"></app-topbar>

    <main class="p-3.5 md:p-5">
      <div class="w-full max-w-4xl">

        <!-- COMPACT HEADER -->
        <div class="mb-4 flex items-center justify-between">
          <div>
            <h1 class="text-lg font-bold text-slate-800">Add Class</h1>
            <p class="text-xs text-slate-500">Create a new class master record.</p>
          </div>

          <button type="button" (click)="goBack()"
            class="inline-flex h-8 items-center gap-1 rounded-lg border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-600 shadow-2xs transition hover:bg-slate-50">
            ← Back
          </button>
        </div>

        <!-- COMPACT FORM CARD -->
        <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-xs">
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <!-- CLASS NAME -->
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-slate-700">
                Class Name <span class="text-red-500">*</span>
              </label>
              <input type="text" [(ngModel)]="name" (ngModelChange)="generateSlug()" placeholder="e.g. Class 1"
                class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 text-xs font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/10" />
              @if (submitted && !name.trim()) {
              <p class="mt-1 text-[11px] font-medium text-red-500">
                Class name is required.
              </p>
              }
            </div>

            <!-- SLUG -->
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-slate-700">
                Slug <span class="text-red-500">*</span>
              </label>
              <input type="text" [(ngModel)]="slug" placeholder="e.g. class-1"
                class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 text-xs font-mono font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/10" />
              @if (submitted && !slug.trim()) {
              <p class="mt-1 text-[11px] font-medium text-red-500">
                Slug is required.
              </p>
              }
            </div>

            <!-- STATUS -->
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-slate-700">
                Status
              </label>
              <select [(ngModel)]="status"
                class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50 px-2.5 text-xs font-medium text-slate-700 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/10">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>

            <!-- SORT ORDER -->
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-slate-700">
                Sort Order
              </label>
              <input type="number" [(ngModel)]="sortOrder" min="0" placeholder="0"
                class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 text-xs font-medium text-slate-800 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/10" />
            </div>

          </div>

          <!-- ACTIONS -->
          <div class="mt-5 flex items-center justify-end gap-2 border-t border-slate-100 pt-4">
            <button type="button" (click)="goBack()" [disabled]="saving"
              class="h-8.5 rounded-lg border border-slate-200 bg-white px-3.5 text-xs font-semibold text-slate-600 transition hover:bg-slate-50 disabled:opacity-50">
              Cancel
            </button>

            <button type="button" (click)="saveClass()" [disabled]="saving"
              class="inline-flex h-8.5 items-center gap-1.5 rounded-lg bg-indigo-600 px-4 text-xs font-semibold text-white shadow-sm transition hover:bg-indigo-700 disabled:opacity-60">
              @if (saving) {
              <svg class="h-3.5 w-3.5 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
              Saving...
              } @else {
              Save Class
              }
            </button>
          </div>

        </div>

      </div>
    </main>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
@if (toastMessage) {
<div
  class="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 rounded-xl border px-4 py-2.5 shadow-lg transition-all"
  [class.bg-emerald-900]="toastType === 'success'" [class.text-white]="toastType === 'success'"
  [class.border-emerald-700]="toastType === 'success'" [class.bg-red-900]="toastType === 'error'"
  [class.text-white]="toastType === 'error'" [class.border-red-700]="toastType === 'error'">
  <span class="text-xs font-semibold">{{ toastMessage }}</span>
</div>
}
