<div class="space-y-6">
  <!-- Visibility Controls -->
  <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h3 class="text-sm font-semibold text-slate-900">
          Section Visibility
        </h3>

        <p class="mt-1 text-xs text-slate-500">
          Choose where this image section should be visible.
        </p>
      </div>

      <div class="flex flex-wrap gap-3">
        <!-- Desktop Toggle -->
        <button type="button" role="switch" [attr.aria-checked]="imageSection.desktopActive" (click)="toggleDesktop()"
          class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 transition hover:bg-slate-50">
          <span class="text-xs font-semibold text-slate-600">
            Desktop
          </span>

          <span class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full p-0.5 transition-colors duration-200"
            [class.bg-[#8c7ae6]]="imageSection.desktopActive"
            [class.bg-slate-300]="!imageSection.desktopActive">
            <span class="pointer-events-none inline-block h-4 w-4 rounded-full bg-white shadow-xs transition-transform duration-200"
              [class.translate-x-4]="imageSection.desktopActive"
              [class.translate-x-0]="!imageSection.desktopActive"></span>
          </span>

          <span class="text-xs font-medium text-slate-500">
            {{
            imageSection.desktopActive
            ? 'Show'
            : 'Hide'
            }}
          </span>
        </button>

        <!-- Mobile Toggle -->
        <button type="button" role="switch" [attr.aria-checked]="imageSection.mobileActive" (click)="toggleMobile()"
          class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 transition hover:bg-slate-50">
          <span class="text-xs font-semibold text-slate-600">
            Mobile
          </span>

          <span class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full p-0.5 transition-colors duration-200"
            [class.bg-[#8c7ae6]]="imageSection.mobileActive"
            [class.bg-slate-300]="!imageSection.mobileActive">
            <span class="pointer-events-none inline-block h-4 w-4 rounded-full bg-white shadow-xs transition-transform duration-200"
              [class.translate-x-4]="imageSection.mobileActive"
              [class.translate-x-0]="!imageSection.mobileActive"></span>
          </span>

          <span class="text-xs font-medium text-slate-500">
            {{
            imageSection.mobileActive
            ? 'Show'
            : 'Hide'
            }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Images -->
  <div class="grid gap-5 lg:grid-cols-2">
    <!-- Desktop Image -->
    <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
      <div class="mb-4">
        <h3 class="text-sm font-semibold text-slate-900">
          Desktop Image
        </h3>

        <p class="mt-1 text-xs text-slate-500">
          Upload the image to display on desktop devices.
        </p>
      </div>

      <app-image-upload label="Desktop Image" description="Drag & drop desktop image here or click to browse"
        [imagePreview]="imageSection.desktopImage" (imageChange)="onDesktopImageChange($event)" />
    </div>

    <!-- Mobile Image -->
    <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
      <div class="mb-4">
        <h3 class="text-sm font-semibold text-slate-900">
          Mobile Image
        </h3>

        <p class="mt-1 text-xs text-slate-500">
          Upload the image to display on mobile devices.
        </p>
      </div>

      <app-image-upload label="Mobile Image" description="Drag & drop mobile image here or click to browse"
        [imagePreview]="imageSection.mobileImage" (imageChange)="onMobileImageChange($event)" />
    </div>
  </div>
</div>
