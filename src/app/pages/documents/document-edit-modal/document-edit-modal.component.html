<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
  <div class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3.5 bg-slate-50/50">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-50 text-amber-600 font-bold">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-900">Edit Document #{{ doc.id }}</h2>
          <p class="text-[11px] text-slate-500">PUT /api/v1/backend/documents/{{ doc.id }}</p>
        </div>
      </div>
      <button type="button" (click)="closed.emit()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
      <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-rose-100 text-rose-600 font-bold text-xs">PDF</span>
          <div>
            <p class="text-xs font-semibold text-slate-800">{{ doc.original_name || doc.name }}</p>
            <p class="text-[10px] text-slate-400 font-mono">{{ doc.relative_path || 'Protected PDF storage' }}</p>
          </div>
        </div>
        <span class="rounded bg-slate-200/80 px-2 py-0.5 text-[10px] font-bold text-slate-600">
          {{ formatBytes(doc.size_bytes) }}
        </span>
      </div>

      @if (updateError) {
      <div class="rounded-xl border border-rose-200 bg-rose-50 p-3 text-xs text-rose-700">{{ updateError }}</div>
      }

      <form (ngSubmit)="submit()" class="space-y-3.5">
        <div>
          <label class="mb-1 block text-xs font-bold text-slate-700">Document Name <span class="text-rose-500">*</span></label>
          <input type="text" [(ngModel)]="editName" name="editName" required
            class="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-xs text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/10" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-bold text-slate-700">Download Filename</label>
          <input type="text" [(ngModel)]="editDownloadFilename" name="editDownloadFilename"
            class="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-xs text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/10" />
          <p class="mt-0.5 text-[10px] text-slate-400">The file name users will receive upon downloading.</p>
        </div>
        <div>
          <label class="mb-1 block text-xs font-bold text-slate-700">Status</label>
          <div class="grid grid-cols-2 gap-2">
            <label [class.border-emerald-500]="editStatus === 'ACTIVE'" [class.bg-emerald-50/50]="editStatus === 'ACTIVE'"
              class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 p-2.5 transition hover:bg-slate-50">
              <input type="radio" [(ngModel)]="editStatus" name="editStatus" value="ACTIVE" class="text-emerald-600 focus:ring-emerald-500" />
              <div>
                <p class="text-xs font-bold text-slate-800">ACTIVE</p>
                <p class="text-[10px] text-slate-500">Available for downloads</p>
              </div>
            </label>
            <label [class.border-amber-500]="editStatus === 'INACTIVE'" [class.bg-amber-50/50]="editStatus === 'INACTIVE'"
              class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 p-2.5 transition hover:bg-slate-50">
              <input type="radio" [(ngModel)]="editStatus" name="editStatus" value="INACTIVE" class="text-amber-600 focus:ring-amber-500" />
              <div>
                <p class="text-xs font-bold text-slate-800">INACTIVE</p>
                <p class="text-[10px] text-slate-500">Retired / disabled</p>
              </div>
            </label>
          </div>
        </div>
        <div class="flex items-center justify-between border-t border-slate-100 pt-3">
          <div class="flex items-center gap-1.5">
            <button type="button" (click)="retireRequested.emit(doc)"
              class="rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-1.5 text-xs font-semibold text-amber-700 hover:bg-amber-100 transition">
              Retire
            </button>
            <button type="button" (click)="deleteRequested.emit(doc)"
              class="rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-xs font-semibold text-rose-700 hover:bg-rose-100 transition">
              Delete
            </button>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" (click)="closed.emit()"
              class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">
              Cancel
            </button>
            <button type="submit" [disabled]="isUpdating || !editName.trim()"
              class="inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-4 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-indigo-700 disabled:opacity-50">
              @if (isUpdating) {
              <svg class="h-3.5 w-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
              Saving...
              } @else {
              Save Changes
              }
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
